name: Build Hex for SideStore

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if upstream's iOS code hasn't changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check out upstream Hex
        run: scripts/fetch-upstream.sh upstream dev

      - name: Decide whether to build
        id: plan
        working-directory: upstream
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
          RUN: ${{ github.run_number }}
        run: |
          paths=()
          while IFS= read -r path; do paths+=("$path"); done < <(git sparse-checkout list)
          commit=$(git log -1 --format=%H -- "${paths[@]}")
          last=$(jq -r '.apps[0].versions[0].upstreamCommit // empty' ../source.json)
          if [[ "$commit" == "$last" && "$FORCE" != "true" ]]; then
            echo "Upstream iOS code unchanged since ${last:0:12}; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$last^{commit}" 2>/dev/null || last=""

          count=$(git rev-list --count "$commit")
          marketing=$(awk '/MARKETING_VERSION:/ { print $2; exit }' ios/project.yml)
          version="${marketing%.*}.$count"
          git log -n 20 --format='- %s (%h)' "${last:+$last..}$commit" -- "${paths[@]}" > "$RUNNER_TEMP/notes.md"

          {
            echo "build=true"
            echo "commit=$commit"
            echo "head=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "build_number=$count.$RUN"
            echo "tag=v$version-r$RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: steps.plan.outputs.build == 'true'
        run: brew install xcodegen

      - name: Apply sideload patch
        id: patch
        if: steps.plan.outputs.build == 'true'
        run: scripts/patch-upstream.sh upstream

      - name: Build .ipa
        id: build
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild -version
          scripts/build-ipa.sh upstream "$RUNNER_TEMP/Hex.ipa" "$VERSION" "$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish release and update source.json
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build_number }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          UPSTREAM_HEAD: ${{ steps.plan.outputs.head }}
        run: |
          {
            echo "Unofficial build of https://github.com/anomalyco/hex/commit/$COMMIT for SideStore."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Hex $VERSION ($BUILD_NUMBER)" --notes-file "$RUNNER_TEMP/release.md" \
            "$RUNNER_TEMP/Hex.ipa" upstream/LICENSE upstream/THIRD_PARTY_NOTICES.md

          python3 scripts/update-source.py \
            --source source.json \
            --ipa "$RUNNER_TEMP/Hex.ipa" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Hex.ipa" \
            --upstream-commit "$COMMIT" \
            --notes-file "$RUNNER_TEMP/notes.md"

          # oc-port-agent's checkpoint: the patch is known to work up to this upstream commit,
          # so a later repair only has to look at what changed after it.
          jq --arg sha "$UPSTREAM_HEAD" '.lastSyncedCommit = $sha' .oc-port/state.json > "$RUNNER_TEMP/state.json"
          mv "$RUNNER_TEMP/state.json" .oc-port/state.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json .oc-port/state.json
          git commit -m "Hex $VERSION ($BUILD_NUMBER)"
          git pull --rebase
          git push

      - name: Ask oc-port-agent to repair the sideload patch
        if: failure() && steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
        run: |
          # Patched files whose compile errors mean the patch, not upstream, is at fault.
          patched=$(git -C upstream status --porcelain -- ios | awk '{ print $2 }' | xargs -n1 basename | paste -sd'|' -)
          if [[ "$PATCH_OUTCOME" != failure ]] &&
             ! grep -qE "/(${patched:-none}):[0-9]+:[0-9]+: error:" "$RUNNER_TEMP/build.log" 2>/dev/null; then
            echo "The build failed for a reason the sideload patch doesn't cover; not starting oc-port-agent."
            exit 0
          fi

          # One automatic attempt per breakage: skip if the previous build already failed or a repair PR is open.
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --status completed --limit 20 \
            --json conclusion --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion // "success"')
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("oc-port/"))] | length')
          if [[ "$previous" == failure || "$open" != 0 ]]; then
            echo "A repair was already attempted for this breakage (previous build: $previous, open oc-port PRs: $open)."
            exit 0
          fi

          gh workflow run upstream-port.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=sync
          echo "::warning::The sideload patch no longer fits upstream; started oc-port-agent to propose a fix."
